[project]
name = "core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av==18.0.0",
    "easyocr==1.7.2",
    "fastapi==0.135.3",
    "faster-whisper==1.2.1",
    "gliner==0.2.28",
    "numpy==2.3.5",
    "nvidia-cublas-cu12>=12.9.2.10",
    "open-clip-torch==3.3.0",
    "openai==2.48.0",
    "opencv-python==4.13.0.92",
    "pillow==12.0.0",
    "pyannote-audio==4.0.7",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.24",
    "qdrant-client==1.19.0",
    "scenedetect==0.7.1",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "sentence-transformers==5.1.2",
    "silero-vad==6.2.1",
    "soundfile==0.14.0",
    "supabase==2.31.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchvision==0.26.0",
    "transformers==4.57.2",
    "ultralytics==8.4.41",
    "uvicorn==0.44.0",
]

# torch/torchaudio/torchvision come from PyTorch's CUDA 13.0 index on Linux and
# Windows (PyPI's Windows wheels are CPU-only). macOS has no CUDA builds, so it
# falls back to PyPI.
[tool.pytest.ini_options]
testpaths = ["tests"]
# Importing the package pulls in torch, pyannote and open-clip, which is slow
# but happens once per session. Nothing here loads an embedding model or opens
# a video; the cases that need a GPU and a live provider are the manual ones.
addopts = "-q --strict-markers"

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
